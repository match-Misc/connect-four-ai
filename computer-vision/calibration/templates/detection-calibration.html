<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Four Detection Calibration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        h1 { margin: 0; padding: 10px 15px; }
        .box {
            display: flex; /* Use flexbox for alignment */
            flex-direction: column; /* Stack children vertically */
            justify-content: flex-start; /* Align content to the top */
            align-items: center; /* Vertically aligns items */
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            width: 100%; /* Ensure it takes full width */
            box-sizing: border-box; /* Include padding and border in the element's total width */
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .image-container {
            display: flex; /* Use flexbox for alignment */
            flex-direction: column; /* Stack children vertically */
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
            position: relative;
            text-align: center;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        img { width: 100%; max-width: 640px; border-radius: 5px; }
        .header-box {
            display: flex; /* Use flexbox for alignment */
            justify-content: space-between; /* Pushes title and logo to opposite ends */
            align-items: center; /* Vertically aligns items */
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            width: 100%; /* Ensure it takes full width */
            box-sizing: border-box; /* Include padding and border in the element's total width */
        }
        
        .tab-nav {
            display: flex; /* Use flexbox for alignment */
            justify-content: flex-start; /* Align tabs to the left */
            align-items: stretch; /* Stretch items to fill container height */
            padding: 0;
            width: 100%; /* Ensure it takes full width */
            box-sizing: border-box; /* Include padding and border in the element's total width */
            background-color: #e9e9e9;
            border-bottom: 1px solid #ccc;
            margin: 0;
        }

        .tab-button {
            display: inline-flex; /* Use flexbox for alignment */
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            flex: 1;
            background-color: #e9e9e9;
            border: none;
            border-right: 1px solid #ccc;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            transition: all 0.3s ease;
            border-radius: 0;
            margin-right: 0;
            position: relative;
            box-sizing: border-box; /* Include padding and border in the element's total width */
        }

        .tab-button:last-child {
            border-right: none;
        }

        .tab-button:hover {
            background-color: #f0f0f0;
            color: #333;
        }

        .tab-button.active {
            background-color: #f8f8f8; /* Matches content box background */
            color: #333;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #B0CA1F;
        }

        .tab-content-container {
            display: flex; /* Use flexbox for alignment */
            flex-direction: column; /* Stack children vertically */
            justify-content: flex-start; /* Align content to the top */
            align-items: stretch; /* Stretch items to fill width */
            border: 1px solid #ccc; /* Full border */
            background-color: #f8f8f8;
            padding: 0;
            border-radius: 10px; /* Fully rounded box */
            overflow: hidden; /* Clip tabs to the border radius */
            width: 100%; /* Ensure it takes full width */
            box-sizing: border-box; /* Include padding and border in the element's total width */
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 0;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }
        .legend {
            display: flex; /* Use flexbox for alignment */
            flex-direction: column; /* Stack children vertically */
            justify-content: flex-start; /* Align content to the top */
            align-items: flex-start; /* Align items to the left */
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            width: 100%; /* Ensure it takes full width */
            box-sizing: border-box; /* Include padding and border in the element's total width */
            margin-top: 20px;
        }
        .color-box { display: inline-block; width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; }
        button {
            display: inline-flex; /* Use flexbox for alignment */
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            border: 1px solid #ccc;
            background-color: #007bff;
            padding: 12px 20px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 5px;
            box-sizing: border-box; /* Include padding and border in the element's total width */
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        input { margin: 5px 0; padding: 5px; }
        .save-all {
            display: inline-flex; /* Use flexbox for alignment */
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            border: 1px solid #ccc;
            background-color: #007bff;
            padding: 12px 20px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            position: fixed;
            bottom: 20px;
            right: 20px;
            box-sizing: border-box; /* Include padding and border in the element's total width */
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .save-all:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-box">
            <div>
                <h1 class="header-title">Connect Four Detection Calibration</h1>
            </div>
            <img src="../../../../static/img/match_NUR_Logo_10pt.svg" alt="Logo" class="logo" id="logo">
        </div>
    </div>
    <div class="box image-container">
        <img id="videoFeed" src="/frame" alt="RealSense Feed">
    </div>
    <div class="tab-content-container">
        <div class="tab-nav">
            <button class="tab-button active" onclick="showTab('hole')">Hole Parameters</button>
            <button class="tab-button" onclick="showTab('color')">Color Settings</button>
        </div>
        <div id="hole" class="tab-content active">
            <label>Diameter: <input type="number" name="hole_diameter" value="{{ hole_diameter }}" min="10" max="200" oninput="updateSingle(this)"></label><br>
            <button id="resetBtn">Reset Corners</button>
            <button onclick="saveCorners()">Save Corners</button>
            <button onclick="saveHoleSettings()">Save Hole Diameter Settings</button>
        </div>
        <div id="color" class="tab-content">
            <h3>Image Adjustments</h3>
            <label>Contrast: <input type="number" name="contrast" value="{{ contrast }}" min="0" max="200" oninput="updateSingle(this)"></label><br>
            <label>Saturation: <input type="number" name="saturation" value="{{ saturation }}" min="0" max="200" oninput="updateSingle(this)"></label><br>
            <label>Brightness: <input type="number" name="brightness" value="{{ brightness }}" min="-100" max="100" oninput="updateSingle(this)"></label><br>
            <h3>Max RGB</h3>
            <label>Max R: <input type="number" name="max_r" value="{{ max_r }}" min="0" max="255" oninput="updateSingle(this)"></label><br>
            <label>Max G: <input type="number" name="max_g" value="{{ max_g }}" min="0" max="255" oninput="updateSingle(this)"></label><br>
            <label>Max B: <input type="number" name="max_b" value="{{ max_b }}" min="0" max="255" oninput="updateSingle(this)"></label><br>
            <button id="calibrateBtn">Calibrate Colors</button>
            <button onclick="saveColorCalibration()">Save Color Calibration</button>
            <button onclick="saveMaxRGB()">Save Max RGB Values</button>
            </div>
        </div>
    </div>
    <div class="legend">
        <h3>Legend</h3>
        <div>Player 1: <span class="color-box" id="p1Color"></span><span id="p1Text">Not calibrated</span></div>
        <div>Player 2: <span class="color-box" id="p2Color"></span><span id="p2Text">Not calibrated</span></div>
    </div>
    <div id="status">{{ status }}</div>
    <div style="display:none" id="p1data">{{ p1_color|tojson if p1_color else 'null' }}</div>
    <div style="display:none" id="p2data">{{ p2_color|tojson if p2_color else 'null' }}</div>
    <button class="save-all" onclick="saveAll()">Save All</button>
    <script>
        const img = document.getElementById('videoFeed');
        const statusDiv = document.getElementById('status');
        const p1Color = document.getElementById('p1Color');
        const p2Color = document.getElementById('p2Color');
        const p1Text = document.getElementById('p1Text');
        const p2Text = document.getElementById('p2Text');

        // Set initial colors if loaded
        const p1data = JSON.parse(document.getElementById('p1data').textContent);
        const p2data = JSON.parse(document.getElementById('p2data').textContent);
        if (p1data) {
            p1Color.style.backgroundColor = `rgb(${p1data[0]}, ${p1data[1]}, ${p1data[2]})`;
            p1Text.textContent = `RGB(${p1data.join(', ')})`;
        }
        if (p2data) {
            p2Color.style.backgroundColor = `rgb(${p2data[0]}, ${p2data[1]}, ${p2data[2]})`;
            p2Text.textContent = `RGB(${p2data.join(', ')})`;
        }

        function updateFrame() {
            img.src = '/frame?' + new Date().getTime();
        }
        setInterval(updateFrame, 1000);

        function showTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`button[onclick="showTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function updateSingle(el) {
            const formData = new FormData();
            formData.append('name', el.name);
            formData.append('value', el.value);
            fetch('/update_single', {
                method: 'POST',
                body: formData
            }).then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
                // Force image update
                img.src = '/frame?' + Date.now();
            });
        }

        function saveCorners() {
            // Assuming save grid only saves corners
            fetch('/save_grid', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        }

        function saveHoleSettings() {
            // Save hole diameter
            fetch('/save_hole', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        }

        function saveColorCalibration() {
            // Save image adjustments
            fetch('/save_color', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        }

        function saveMaxRGB() {
            fetch('/save_max_rgb', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        }

        function saveAll() {
            fetch('/save', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        }

        img.addEventListener('click', function(e) {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const scaleX = img.naturalWidth / rect.width;
            const scaleY = img.naturalHeight / rect.height;
            const realX = x * scaleX;
            const realY = y * scaleY;
            console.log(`Clicked at image coordinates: (${realX.toFixed(2)}, ${realY.toFixed(2)})`);
            fetch('/click', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: realX, y: realY })
            }).then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        });

        document.getElementById('calibrateBtn').addEventListener('click', function() {
            fetch('/calibrate_colors', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
                if (data.p1_color) {
                    p1Color.style.backgroundColor = `rgb(${data.p1_color[0]}, ${data.p1_color[1]}, ${data.p1_color[2]})`;
                    p1Text.textContent = `RGB(${data.p1_color.join(', ')})`;
                }
                if (data.p2_color) {
                    p2Color.style.backgroundColor = `rgb(${data.p2_color[0]}, ${data.p2_color[1]}, ${data.p2_color[2]})`;
                    p2Text.textContent = `RGB(${data.p2_color.join(', ')})`;
                }
            });
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            fetch('/reset', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
                p1Color.style.backgroundColor = '';
                p2Color.style.backgroundColor = '';
                p1Text.textContent = 'Not calibrated';
                p2Text.textContent = 'Not calibrated';
            });
        });
    </script>
</body>
</html>
