<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RealSense Calibration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { display: flex; }
        .image-container { flex: 1; }
        img { width: 100%; max-width: 640px; }
        .controls { flex: 1; margin-left: 20px; }
    </style>
</head>
<body>
    <h1>RealSense Calibration</h1>
    <div class="container">
        <div class="image-container">
            <img id="depthFeed" src="/frame" alt="Depth Feed">
        </div>
        <div class="controls">
            <form id="paramsForm">
                <label>Exposure: <input type="range" name="exposure" min="1" max="10000" value="5000"> <span id="expVal">5000</span></label><br>
                <label>Gain: <input type="range" name="gain" min="16" max="248" value="128"> <span id="gainVal">128</span></label><br>
                <label>Laser Power: <input type="range" name="laser_power" min="0" max="360" value="150"> <span id="laserVal">150</span></label><br>
                <label>Visual Preset: <input type="range" name="visual_preset" min="0" max="5" value="1"> <span id="presetVal">1</span></label><br>
                <label>Min Depth (mm): <input type="range" name="min_depth" min="0" max="5000" value="0"> <span id="minVal">0</span></label><br>
                <label>Max Depth (mm): <input type="range" name="max_depth" min="0" max="10000" value="2000"> <span id="maxVal">2000</span></label><br>
                <label>Emitter: <input type="range" name="emitter" min="0" max="2" value="1"> <span id="emitVal">1</span></label><br>
                <button type="submit">Update Parameters</button>
            </form>
            <br>
            <button id="saveBtn">Save Settings</button>
            <div id="status"></div>
        </div>
    </div>
    <script>
        const img = document.getElementById('depthFeed');
        const statusDiv = document.getElementById('status');

        function updateFrame() {
            img.src = '/frame?' + new Date().getTime();
        }
        setInterval(updateFrame, 100);

        // Update value displays
        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', function() {
                document.getElementById(this.name + 'Val').textContent = this.value;
            });
        });

        document.getElementById('paramsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/update_params', {
                method: 'POST',
                body: formData
            }).then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        });

        document.getElementById('saveBtn').addEventListener('click', function() {
            fetch('/save', { method: 'POST' })
            .then(res => res.json()).then(data => {
                statusDiv.textContent = data.status;
            });
        });
    </script>
</body>
</html>
