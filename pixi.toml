[workspace]
authors = ["Florwie <wiemann@match.uni-hannover.de>"]
channels = ["conda-forge"]
name = "connect-four-ai"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
setup = "bash scripts/setup.sh"
calibrate = "python computer-vision/calibration/calibration_server.py"
build-frontend = "cd computer-vision/calibration/frontend && npm install && npm run build"
start-backend = "cd robot-game/backend && flask --app main run --host 0.0.0.0 --port 8000"
start-frontend = "cd robot-game/frontend && npm run dev -- --host"
game = "bash scripts/run-game.sh"

[dependencies]
python = ">=3.14.6,<3.15"
flask = ">=3.1.3,<4"
flask-cors = ">=6.0.5,<7"
nodejs = ">=26.5.0,<26.6"
opencv = ">=5.0.0,<6"
pydantic = ">=2.13.4,<3"
pyserial = ">=3.5,<4"

[pypi-dependencies]
pyrealsense2 = ">=2.58.2.10647, <3"
maturin = ">=1.14.1, <2"
