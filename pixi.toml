[workspace]
authors = ["Florwie <wiemann@match.uni-hannover.de>"]
channels = ["conda-forge"]
name = "connect-four-ai"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
calibrate = "python computer-vision/calibration/calibration_server.py"

[dependencies]
python = ">=3.14.6,<3.15"
flask = ">=3.1.3,<4"
flask-cors = ">=6.0.5,<7"
nodejs = ">=26.5.0,<26.6"
opencv = ">=5.0.0,<6"

[pypi-dependencies]
pyrealsense2 = ">=2.58.2.10647, <3"
