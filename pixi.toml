[workspace]
authors = ["Florwie <wiemann@match.uni-hannover.de>"]
channels = ["conda-forge"]
name = "connect-four-ai"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
calibrate = "python computer-vision/calibration/calibration_server.py"

[dependencies]
python = ">=3.12.0,<3.13"
flask = ">=3.1.3,<4"
flask-cors = ">=6.0.5,<7"
nodejs = ">=26.5.0,<26.6"
opencv = ">=5.0.0,<6"
libvips = ">=8.18.4,<9"

[pypi-dependencies]
pyrealsense2 = ">=2.58.2.10647, <3"
moondream = "*"
pillow = "*"
transformers = "==4.43.0"
einops = ">=0.8.2, <0.9"
accelerate = ">=1.14.0, <2"
mpmath = ">=1.3.0, <2"
torchvision = ">=0.28.0, <0.29"
requests = ">=2.34.2, <3"
pyvips = ">=3.1.1, <4"
